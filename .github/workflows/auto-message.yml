name: Automated Messages

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  auto_response:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Send Welcome Message
        uses: actions/github-script@v7
        with:
          script: |
            const core = require('@actions/core');
            const fs = require('fs');
            const path = require('path');

            const eventName = context.eventName;
            const action = context.payload.action;
            let messageFile = '';

            console.log(`Event: ${eventName}, Action: ${action}`);

            if (eventName === 'issues' && action === 'opened') {
              messageFile = '.github/auto-messages/issue_opened.md';
            } 
            else if (eventName === 'pull_request_target' && action === 'opened') {
              const association = context.payload.pull_request.author_association;
              console.log(`PR Author Association: ${association}`);

              if (['FIRST_TIMER', 'FIRST_TIME_CONTRIBUTOR', 'NONE'].includes(association)) {
                messageFile = '.github/auto-messages/first_time_pr.md';
              } else {
                messageFile = '.github/auto-messages/pr_opened.md';
              }
            }

            if (!messageFile) {
              console.log('No message template selected.');
              return;
            }

            const workspace = process.env.GITHUB_WORKSPACE;
            const messagePath = path.join(workspace, messageFile);

            if (!fs.existsSync(messagePath)) {
              core.setFailed(`Template file not found: ${messageFile}`);
              return;
            }

            const body = fs.readFileSync(messagePath, 'utf8');
            const issueNumber = eventName === 'issues'
              ? context.issue.number
              : context.payload.pull_request.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

            console.log('Comment posted successfully.');
