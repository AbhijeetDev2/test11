name: Auto Message Bot

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  # Job to welcome new issues
  welcome-issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read issue message template
        id: issue-message
        run: |
          MESSAGE=$(cat .github/auto-messages/issue_opened.md)
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment on new issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const message = `${{ steps.issue-message.outputs.message }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });

  # Job to welcome PRs (with special message for first-time contributors)
  welcome-pr:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if first-time contributor
        id: first-time
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const creator = context.payload.pull_request.user.login;
            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            
            const authorPRs = pullRequests.filter(pr => pr.user.login === creator);
            const isFirstTime = authorPRs.length <= 1;
            
            console.log(`Author: ${creator}, PR count: ${authorPRs.length}, First time: ${isFirstTime}`);
            return isFirstTime;
          result-encoding: string

      - name: Read PR message template
        id: pr-message
        run: |
          MESSAGE=$(cat .github/auto-messages/pr_opened.md)
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Read first-time contributor message template
        id: first-time-message
        run: |
          MESSAGE=$(cat .github/auto-messages/first_time_pr.md)
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const isFirstTime = ${{ steps.first-time.outputs.result }};
            const prMessage = `${{ steps.pr-message.outputs.message }}`;
            const firstTimeMessage = `${{ steps.first-time-message.outputs.message }}`;
            
            let body = prMessage;
            if (isFirstTime === true || isFirstTime === 'true') {
              body = firstTimeMessage + '\n\n---\n\n' + prMessage;
            }
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });
